<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぽっと通話 バナー</title>
<!--
  ぽっと通話 ライブ中バナー（ブログパーツ）。読み取り専用。
  使い方（ブログに貼る）：
    <iframe src="https://potalk.app/tools/banner.html?room=部屋名"
            width="300" height="96" style="border:0;border-radius:14px" loading="lazy"></iframe>
  ?room= に自分の部屋名（URLエンコード）を入れる。
  仕組み：部屋名を SHA-256 でハッシュ化し、公開Nostrリレーの在室イベント(kind 20001)を購読。
         15秒以内に在室があれば「いま通話中」、無ければ「静か」。サーバは介さない。
-->
<style>
  *{ box-sizing:border-box; margin:0 }
  html,body{ height:100% }
  body{ font-family:system-ui,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif; -webkit-font-smoothing:antialiased }
  a.card{
    display:flex; flex-direction:column; justify-content:center; gap:6px;
    height:100%; min-height:76px; padding:12px 16px; text-decoration:none;
    background:radial-gradient(120% 140% at 85% -20%,#1c2b48,#0d1526 62%,#090e1a);
    color:#eef2f8; border:1px solid rgba(255,255,255,.09); border-radius:14px;
    transition:border-color .2s, transform .08s }
  a.card:hover{ border-color:#00e5cc }
  a.card:active{ transform:scale(.99) }
  .top{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; letter-spacing:.02em }
  .top .lob{ font-size:18px; line-height:1 }
  .top .exp{ font-size:11px; color:#9fb0c7; font-weight:700 }
  .status{ display:flex; align-items:center; gap:8px; font-size:13px }
  .dot{ width:9px; height:9px; border-radius:50%; background:#48507a; flex:none }
  .live .dot{ background:#00e5cc; box-shadow:0 0 8px rgba(0,229,204,.7); animation:pulse 1.6s ease-in-out infinite }
  @keyframes pulse{ 50%{ opacity:.45 } }
  @media (prefers-reduced-motion:reduce){ .live .dot{ animation:none } }
  .status .txt{ font-weight:700 }
  .live .txt{ color:#00e5cc }
  .checking .txt{ color:#9fb0c7 }   /* 接続待ちは灰色（静か/通話中とは別の見た目） */
  .people{ display:inline-flex; gap:2px; margin-left:2px }
  .cta{ margin-left:auto; font-size:12px; color:#9fb0c7; white-space:nowrap }
  .room{ font-size:11px; color:#7a90ad; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
</style>
</head>
<body>
<a class="card" id="card" href="#" target="_blank" rel="noopener">
  <div class="top"><span class="lob">🦞</span>ぽっと通話<span class="exp">〈実験版〉</span></div>
  <div class="status" id="status">
    <span class="dot"></span><span class="txt" id="txt">読み込み中…</span>
    <span class="people" id="people"></span>
    <span class="cta" id="cta"></span>
  </div>
  <div class="room" id="roomLine"></div>
</a>

<script type="module">
const $ = id => document.getElementById(id)
const APP = 'https://potalk.app/'
const RELAYS = ['wss://relay.primal.net', 'wss://purplerelay.com', 'wss://bucket.coracle.social', 'wss://yabu.me/v2', 'wss://x.kojira.io', 'wss://relay.notoshi.win', 'wss://relay.mostr.pub']
// これだけ新着が無ければ「その人は退出」。
// ★本体 index.html の NOSTR_PUBLISH_MS（在室を流す間隔）と**対**になっている。
// 2026-08-14：本体を5秒→30秒に間引いた（公開リレーに「投稿しすぎ」と絞られていたため）ので、
// こちらも 15秒→90秒 に広げた。**片方だけ変えると、居るのに居ないと表示される。**
const STALE_MS = 90000

const params = new URLSearchParams(location.search)
const room = (params.get('room') || '').slice(0, 60)

// 部屋リンク（クリックでその部屋を開く）。room が無ければトップへ
$('card').href = room ? APP + '#' + encodeURIComponent(room) : APP
$('roomLine').textContent = room ? '部屋：' + room : ''

const seen = new Map()   // pubkey → { ts(受信時刻), emoji }
let card = $('card')
// 接続前に「静か」と誤って出さないための状態。room があるうちは接続＆判定が済むまで「確認中…」。
// ハートビートは5秒間隔なので、接続後この時間だけ在室が無ければ「静か」で確定する。
let checked = !room
const GRACE_MS = 8000   // 接続＋ハートビート(5秒)＋リレー遅延を見込んだ猶予。これを過ぎて在室無しなら「静か」確定

const render = () => {
  const now = Date.now()
  for (const [k, v] of seen) if (now - v.ts > STALE_MS) seen.delete(k)
  const live = seen.size > 0
  card.classList.toggle('live', live)
  card.classList.toggle('checking', !live && !checked)
  if (live) {
    $('txt').textContent = 'いま通話中'
    $('cta').textContent = 'タップで参加 →'
    const emojis = [...seen.values()].slice(0, 5).map(v => v.emoji || '🙂')
    $('people').textContent = emojis.join('') + (seen.size > 5 ? '…' : '')
  } else if (!checked) {
    $('txt').textContent = '確認中…'
    $('cta').textContent = ''
    $('people').textContent = ''
  } else {
    $('txt').textContent = room ? 'いまは静か' : 'ぽっと通話へ'
    $('cta').textContent = room ? '部屋を開く →' : '開く →'
    $('people').textContent = ''
  }
}
render()
setInterval(render, 2000)   // 失効を反映して定期的に描き直す

// room 未指定なら購読しない（静的バナーとしてリンクだけ／checked は最初から true）
if (room) {
  try {
    const nt = await import('https://esm.sh/nostr-tools@2.10.4')
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('potto:' + room))
    const d = [...new Uint8Array(buf)].slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('')
    const pool = new nt.SimplePool()
    pool.subscribeMany(RELAYS, [{ kinds: [20001], '#d': [d], since: Math.floor(Date.now() / 1000) - 20 }], {
      onevent(e) {
        checked = true
        let emoji = '🙂'
        try { emoji = JSON.parse(e.content).e || '🙂' } catch {}
        seen.set(e.pubkey, { ts: Date.now(), emoji })   // 発信者ごとに最新受信時刻で更新
        render()
      }
    })
    // 接続後、ハートビート間隔ぶん待って在室が無ければ「静か」で確定（それまでは「確認中…」のまま）
    setTimeout(() => { checked = true; render() }, GRACE_MS)
  } catch {
    // Nostr が読めなくても、静的な「開く」バナーとして成立させる（見た目は壊さない）
    checked = true
    render()
  }
}
</script>
</body>
</html>
